name: Refresh backend security dependencies

on:
  push:
    branches:
      - fix/backend-audit-20261001
    paths:
      - ".github/workflows/refresh-backend-deps.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: yor_tokens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_tokens_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_tokens_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/backend-audit-20261001
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply available backend security updates
        working-directory: backend
        run: npm audit fix
      - name: Verify high-severity audit gate
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Verify backend
        working-directory: backend
        run: npm run verify
      - name: Verify migrations, seed, and integration tests
        working-directory: backend
        run: |
          npm run prisma:migrate
          npm run prisma:seed
          npm run test:integration
      - name: Commit validated dependency refresh
        shell: bash
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json; then
            echo "No dependency file changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "deps: refresh audited backend dependencies"
          git push origin HEAD:fix/backend-audit-20261001
