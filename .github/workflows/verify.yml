name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: yor_tokens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_tokens_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_tokens_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run prisma:migrate
      - run: npm run prisma:seed
      - run: npm run test:integration
      - run: docker build --tag yor-token-usage-backend:ci .
      - name: Report production image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: yor-token-usage-backend:ci
          fail-build: false
          severity-cutoff: high
          output-format: table
      - name: Block fixable high and critical production image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: yor-token-usage-backend:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install extension verification dependencies
        run: npm ci
      - name: Verify TypeScript compilation
        run: npm run typecheck
      - name: Build extension runtime bundles from source
        run: npm run build
      - name: Verify extension design contract
        run: npm run design:check
      - name: Run accuracy calibration regression
        run: npm run accuracy:benchmark
      - name: Run extension regression suite
        run: npm run regression:check
      - name: Install Chromium for extension regressions
        run: npx playwright install --with-deps chromium
      - name: Verify unpacked extension in Chromium (controlled provider fixture)
        run: npm run browser:check
      - name: Verify capture through storage and dashboard
        run: npm run capture:check
      - name: Verify normal-motion layout
        run: npm run browser:check
        env:
          YOR_TEST_MOTION: normal
      - name: Validate and package extension
        shell: pwsh
        run: ./scripts/verify-extension.ps1 -Output "$env:RUNNER_TEMP/yor-token-usage-chrome.zip"
