name: yor-token-usage

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: yor_tokens
      POSTGRES_USER: yor_app
      POSTGRES_PASSWORD: yor_local_dev_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - yor_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yor_app -d yor_tokens"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - yor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    stop_grace_period: 10s

volumes:
  yor_postgres_data:
  yor_redis_data:
